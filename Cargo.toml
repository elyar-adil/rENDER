[workspace]
members = [
    "crates/render-browser",
    "crates/render-dom",
    "crates/render-html",
    "crates/render-css",
    "crates/render-core",
    "crates/render-js",
    "crates/render-layout",
    "crates/render-net",
]
resolver = "3"

[workspace.package]
edition = "2024"
# Must match LICENSE: the rENDER Non-Commercial License 1.0. Do not replace this
# with a standard identifier - WTFPL would grant commercial use that the LICENSE
# file and README explicitly withhold, and cargo surfaces this field to every
# downstream consumer.
license = "LicenseRef-rENDER-Non-Commercial-1.0"
rust-version = "1.88"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
