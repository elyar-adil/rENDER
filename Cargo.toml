[workspace]
members = [
    "bindings/python",
    "crates/render-browser",
    "crates/render-core",
    "crates/render-net",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "WTFPL"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
