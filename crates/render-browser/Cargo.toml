[package]
name = "render-browser"
description = "Native preview shell for the self-owned rENDER Rust engine"
default-run = "render-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arboard = { version = "3.6.1", default-features = false }
base64 = "0.22.1"
# `safer-bytes 0.2`, used by the WOFF2 decoder, does not compile against
# bytes 1.6+ (the inherent `try_get_*` methods collide with its trait). Pin the
# version the decoder was built against until it updates its dependency.
bytes = "=1.10.0"
encoding_rs = "0.8.35"
flate2 = "1.1"
fontdue = "0.9.3"
image-codec = { package = "image", version = "0.25.8", default-features = false, features = ["png"] }
render-core = { path = "../render-core" }
render-net = { path = "../render-net" }
pollster = "1.0"
softbuffer = { version = "0.4.8", default-features = false }
# `default-features = false` means every target must select its own graphics
# backend. Leaving `metal` out makes `wgpu::Instance::new` panic on macOS
# because no implemented backend feature is enabled.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
woff2 = { package = "woff2-patched", version = "0.4.0" }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal"] }

# winit and softbuffer have no window-system backend on Linux unless one is
# selected, and the build fails with `compile_error!` without it. X11 and
# Wayland are loaded at run time (`*-dlopen`), so building needs no system
# development packages and the binary still runs on either session type.
# `vulkan` and `gles` cover the wgpu presenter's `PRIMARY` backends on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "gles"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[lints]
workspace = true
