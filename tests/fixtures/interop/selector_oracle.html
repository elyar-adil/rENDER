<!doctype html>
<html id="root"><head><title>Selector oracle</title></head><body>
<main id="main">
  <section id="card" class="card">
    <h2 id="heading"></h2>
    <p id="lead" class="lead hot"></p>
    <p id="tail"></p>
  </section>
</main>
<a id="link" data-tags="one two" lang="en-US" href="HTTPS://EXAMPLE.COM/Page.HTML"></a>
<ul id="list"><li id="item-a" class="x"></li>text<li id="item-b"></li><li id="item-c" class="x"> </li></ul>
<article id="article-a" class="card"><h3></h3></article><article id="article-b"></article>
<div id="sib-a"><span><b></b></span></div><div id="sib-b"></div><p id="sib-p"></p>
<div id="empty"><!-- comment --></div><div id="whitespace"> </div>
<div id="123" class="a+b"></div>
<script>
  const selectors = [
    "main > .card h2 + p.hot",
    "h2 ~ p",
    "[data-tags~=two][lang|=en][href^='https' i][href$='.html' i]",
    "li:nth-child(2)",
    "li:nth-child(2 of .x)",
    "article:is(.card, #missing):has(> h3)",
    "div:has(span b)",
    "div:has(+ #sib-p)",
    "#empty:empty",
    "#whitespace:empty",
    "#\\31 23.a\\+b",
    ":scope > body",
    "p::before",
  ];
  const matches = Object.fromEntries(selectors.map(selector => [
    selector,
    [...document.querySelectorAll(selector)].map(node => node.id),
  ]));
  const invalid = ["#123", "div, :unsupported()", ":nth-of-type(2 of .x)"];
  const invalidResults = Object.fromEntries(invalid.map(selector => {
    try {
      document.querySelectorAll(selector);
      return [selector, false];
    } catch (error) {
      return [selector, error.name === "SyntaxError"];
    }
  }));
  const quirksDocument = new DOMParser().parseFromString("<div id='MixedId' class='MixedClass'></div>", "text/html");
  const quirks = {
    compatMode: quirksDocument.compatMode,
    classLower: quirksDocument.querySelectorAll(".mixedclass").length,
    idLower: quirksDocument.querySelectorAll("#mixedid").length,
  };
  document.body.setAttribute("data-selector-oracle", JSON.stringify({matches, invalid: invalidResults, quirks}));
</script>
