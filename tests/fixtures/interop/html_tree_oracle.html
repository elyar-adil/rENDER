<!doctype html>
<html lang="en">
<head><title>T&amp;</title></head>
<body id="first"><body id="second" class="page">
<p>one<div>two</div>
<ul><li>a<li>b</ul>
<div id="table-host"><table>outside<tr><td>A<td>B</table></div>
<textarea>
A&amp;<b></textarea>
<script>
  const table = document.querySelector("table");
  const host = document.getElementById("table-host");
  const result = {
    compatMode: document.compatMode,
    title: document.title,
    htmlLang: document.documentElement.getAttribute("lang"),
    bodyId: document.body.getAttribute("id"),
    bodyClass: document.body.getAttribute("class"),
    bodyElements: [...document.body.children].map(node => node.localName),
    listItems: [...document.querySelectorAll("li")].map(node => node.textContent),
    tableChildren: [...table.children].map(node => node.localName),
    rowCells: [...table.rows[0].cells].map(node => node.textContent),
    fosteredText: host.firstChild.data,
    textArea: document.querySelector("textarea").textContent,
  };
  document.body.setAttribute("data-oracle", JSON.stringify(result));
</script>
