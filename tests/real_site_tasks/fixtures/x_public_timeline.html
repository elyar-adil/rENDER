<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Public timeline reading task fixture</title>
  <link rel="stylesheet" href="/assets/site.css">
  <script type="module" src="/assets/timeline.js"></script>
</head>
<body>
  <main id="scenario" class="scenario-shell timeline-shell">
    <div id="hydrate-root" aria-live="polite"></div>
    <section id="timeline" aria-label="Public timeline">
      <article>
        <h1>Public post</h1>
        <p>Public post text supports reading, scrolling, selection, and link discovery.</p>
        <img src="/assets/post-image.png" alt="Public post attachment">
        <video controls preload="metadata" poster="/assets/poster.png">
          <source src="/media/post-init.mp4" type="video/mp4">
        </video>
        <a href="/example/status/1">Open public thread</a>
      </article>
      <article><p>Second timeline item used to model a virtual-list viewport.</p></article>
      <div class="content-spacer">More public posts</div>
    </section>
    <aside aria-label="Authentication boundary">
      <a href="/login" rel="nofollow">Sign in to reply</a>
    </aside>
  </main>
</body>
</html>
