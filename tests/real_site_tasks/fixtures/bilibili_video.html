<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video task fixture B</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main id="scenario" class="scenario-shell">
    <h1>标准视频详情页</h1>
    <section class="player" aria-label="视频播放器">
      <video id="player" controls preload="metadata" poster="/assets/poster.png">
        <source src="/media/bilibili-init.mp4" type="video/mp4">
      </video>
      <div class="controls" role="group" aria-label="播放控制">
        <button type="button" data-command="play">播放</button>
        <button type="button" data-command="pause">暂停</button>
        <input type="range" min="0" max="300" value="0" aria-label="时间轴">
        <button type="button" data-command="fullscreen">全屏</button>
      </div>
      <div class="timed-overlay" aria-live="off">Timed text overlay</div>
    </section>
    <nav><a href="/video/next">下一个视频</a></nav>
  </main>
</body>
</html>
